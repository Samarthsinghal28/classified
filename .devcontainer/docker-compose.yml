services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "2222:2222"
      - "7777:7777"
      - "5173:5173"
    privileged: true

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eliza
      POSTGRES_PASSWORD: eliza_secure_pass
      POSTGRES_DB: eliza
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/agentserver/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
